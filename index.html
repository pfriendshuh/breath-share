<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0B1E">
<title>Breath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0B1E;
    --surface: #1A1630;
    --gold: #F5C842;
    --text: #F0EBE3;
    --text2: #9E94A8;
    --divider: #2A2540;
    --serif: "Playfair Display", Georgia, serif;
    --sans: Nunito, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #07060F; color: var(--text); font-family: var(--sans);
    overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  #backdrop {
    position: fixed; inset: -40px; background-size: cover; background-position: center;
    filter: blur(28px) brightness(0.35);
  }
  #stage {
    position: relative; height: 100vh; height: 100dvh;
    width: min(100vw, 520px, calc(100dvh * 0.6)); margin: 0 auto;
    overflow: hidden; background: var(--bg); box-shadow: 0 0 80px rgba(0,0,0,0.6);
  }
  @media (max-width: 560px) { #stage { width: 100vw; } }
  .view { position: absolute; inset: 0; display: none; }
  .view.active { display: block; animation: fade 0.45s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center bottom; }
  .caption { color: var(--text2); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin: 22px 0 10px; }

  /* ── Setup ── */
  #setup .shade { position: absolute; inset: 0; background: linear-gradient(rgba(13,11,30,0.55), rgba(13,11,30,0.94) 38%); }
  #setup .scroll { position: absolute; inset: 0; overflow-y: auto; padding: 26px 16px 32px; }
  h1 { font-family: var(--serif); font-size: 38px; text-align: center; }
  .tag { text-align: center; color: var(--text2); font-size: 14px; margin-top: 4px; }
  .locs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .loc {
    position: relative; aspect-ratio: 1 / 1.1; border-radius: 12px; overflow: hidden;
    background-size: cover; background-position: center;
    border: 1.5px solid transparent; opacity: 0.6; transition: opacity 0.2s, border-color 0.2s;
  }
  .loc.sel { border-color: var(--gold); opacity: 1; }
  .loc span {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 2px 5px;
    background: linear-gradient(transparent, rgba(0,0,0,0.8)); font-size: 11px; font-weight: 700;
  }
  .card {
    display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
    padding: 13px 15px; margin-bottom: 8px; border-radius: 14px;
    background: rgba(26,22,48,0.6); border: 1px solid var(--divider);
  }
  .card.sel { background: var(--surface); border: 1.5px solid var(--gold); }
  .card .t { font-weight: 700; font-size: 15px; }
  .card .s { color: var(--gold); font-size: 12px; letter-spacing: 1.5px; margin-left: auto; white-space: nowrap; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chip { padding: 12px 0; border-radius: 12px; font-weight: 700; background: var(--surface); border: 1px solid var(--divider); }
  .chip.sel { background: var(--gold); border-color: var(--gold); color: var(--bg); }
  .btn-primary {
    display: block; width: 100%; margin-top: 28px; padding: 17px 0; border-radius: 16px;
    background: linear-gradient(90deg, #F5C842, #E8965A); color: #1A1000; font-weight: 700; font-size: 17px;
    box-shadow: 0 8px 20px rgba(245,200,66,0.3);
  }

  /* ── Session ── */
  .monk { position: absolute; left: 50%; pointer-events: none; transform-origin: 50% 100%; }
  #breath-canvas, #stars { position: absolute; pointer-events: none; }
  .session-top {
    position: absolute; top: 0; left: 0; right: 0; padding: 16px 20px 0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .close { color: var(--text2); font-size: 28px; line-height: 1; width: 32px; }
  #timer { color: var(--text2); font-size: 14px; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
  #progress { position: absolute; top: 58px; left: 0; right: 0; height: 2px; background: rgba(42,37,64,0.8); }
  #progress div { height: 100%; width: 0; background: var(--gold); }
  #session-name { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; color: var(--text2); font-size: 13px; }
  #done-card {
    position: absolute; left: 16px; right: 16px; bottom: 22px; padding: 22px; border-radius: 20px; text-align: center;
    background: rgba(13,11,30,0.88); border: 1px solid var(--divider);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    opacity: 0; transform: translateY(16px); transition: opacity 0.9s, transform 0.9s; pointer-events: none;
  }
  #done-card.show { opacity: 1; transform: none; pointer-events: auto; }
  #done-card h2 { font-family: var(--serif); font-size: 26px; margin-bottom: 6px; }
  #done-card p { color: var(--text2); font-size: 14px; }
  #done-card .btn-primary { margin-top: 18px; }
</style>
</head>
<body>
<div id="backdrop"></div>
<main id="stage">

  <section class="view" id="setup">
    <div class="bg" id="setup-bg"></div>
    <div class="shade"></div>
    <div class="scroll">
      <h1>Breath</h1>
      <div class="tag">Sit. Breathe with me.</div>
      <div class="caption">Where</div>
      <div class="locs" id="locs"></div>
      <div class="caption">Breath</div>
      <div id="bw-list"></div>
      <div class="caption" id="dur-caption">Minutes</div>
      <div class="chips" id="durs"></div>
      <button class="btn-primary" id="begin-btn">Begin</button>
    </div>
  </section>

  <section class="view" id="session">
    <div class="bg" id="session-bg"></div>
    <img class="monk" id="session-monk" alt="">
    <canvas id="breath-canvas"></canvas>
    <canvas id="stars"></canvas>
    <div class="session-top">
      <button class="close" id="end-btn" aria-label="End session">×</button>
      <span id="timer"></span>
      <span style="width:32px"></span>
    </div>
    <div id="progress"><div></div></div>
    <div id="session-name"></div>
    <div id="done-card">
      <h2>Well breathed.</h2>
      <p id="done-text"></p>
      <button class="btn-primary" id="done-btn">Again</button>
    </div>
  </section>

</main>

const { breathworks: BREATHS, locations: LOCS } = DATA;
const MONK_ASPECT = 666 / 375;
const $ = (id) => document.getElementById(id);

const MINUTES = [1, 3, 5, 10];
const WIM_COUNTS = [20, 30, 45, 60];
const sel = { loc: "temple", bw: "coherent55", minutes: 3, wim: 30 };
let current = null;

function show(view) {
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("active", v.id === view));
  current = view;
}
function stageSize() { const r = $("stage").getBoundingClientRect(); return { W: r.width, H: r.height }; }
function setBg(locId) {
  $("backdrop").style.backgroundImage = $("setup-bg").style.backgroundImage = `url(${BACKGROUNDS[locId]})`;
}

// ── Setup ──────────────────────────────────────────────────────────────
function btn(cls, onclick, parent) {
  const b = document.createElement("button");
  b.className = cls; b.onclick = onclick; parent.appendChild(b);
  return b;
}
function renderSetup() {
  setBg(sel.loc);
  const locs = $("locs"); locs.innerHTML = "";
  for (const l of LOCS) {
    const b = btn("loc" + (l.id === sel.loc ? " sel" : ""), () => { sel.loc = l.id; renderSetup(); }, locs);
    b.style.backgroundImage = `url(${BACKGROUNDS[l.id]})`;
    b.title = l.description;
    b.innerHTML = `<span>${l.name.replace(/^The /, "")}</span>`;
  }
  const list = $("bw-list"); list.innerHTML = "";
  for (const bw of BREATHS) {
    const b = btn("card" + (sel.bw === bw.id ? " sel" : ""), () => { sel.bw = bw.id; renderSetup(); }, list);
    b.title = bw.description;
    b.innerHTML = `<span class="t"></span><span class="s"></span>`;
    b.querySelector(".t").textContent = bw.name;
    b.querySelector(".s").textContent = bw.subtitle;
  }
  const isWim = BREATHS.find((b) => b.id === sel.bw).isWimHof;
  $("dur-caption").textContent = isWim ? "Breaths" : "Minutes";
  const durs = $("durs"); durs.innerHTML = "";
  for (const n of isWim ? WIM_COUNTS : MINUTES) {
    const on = isWim ? sel.wim === n : sel.minutes === n;
    const c = btn("chip" + (on ? " sel" : ""), () => { if (isWim) sel.wim = n; else sel.minutes = n; renderSetup(); }, durs);
    c.textContent = n;
  }
}
$("begin-btn").onclick = () => {
  const bw = BREATHS.find((b) => b.id === sel.bw);
  startSession(bw, bw.isWimHof ? { wimTarget: sel.wim } : { seconds: sel.minutes * 60 });
};

// ── Active session (same engine as the lite version / BreathGuideWidget) ──
const INHALE = "#88C0D0", HOLD_FULL = "#F5C842", EXHALE = "#E8965A", HOLD_EMPTY = "#7B9EA6";
const WIM_RECOVERY = 15;
let S = null;

function phaseColor(bw, i) {
  const ph = bw.phases[i];
  if (!ph.isHold) return ph.label === "Inhale" ? INHALE : EXHALE;
  if (i === 0) return HOLD_FULL;
  return bw.phases[i - 1].label === "Inhale" ? HOLD_FULL : HOLD_EMPTY;
}
const holdValue = (bw, i) => (i === 0 || bw.phases[i - 1].label === "Inhale" ? 1 : 0);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const pad2 = (n) => String(n).padStart(2, "0");
const fmt = (s) => `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`;

function placeMonk(img, loc, W, H) {
  img.style.width = W * loc.monkScale + "px";
  img.style.bottom = H * loc.monkAnchorY + "px";
  img.style.marginLeft = (-W * loc.monkScale) / 2 + "px";
}

function startSession(bw, opts) {
  const loc = LOCS.find((l) => l.id === sel.loc);
  S = {
    bw, loc, total: opts.seconds || 0, wimTarget: opts.wimTarget || 0,
    start: performance.now(), phaseIdx: 0, phaseStart: performance.now(),
    wimStage: "breathing", wimBreaths: 0, stageStart: 0, raf: 0, tick: 0, done: false,
  };
  show("session");
  layoutSession();
  $("session-name").textContent = bw.name;
  $("done-card").classList.remove("show");
  $("stars").style.display = "none";
  $("breath-canvas").style.display = "";
  $("end-btn").style.visibility = "visible";
  $("timer").style.visibility = bw.isWimHof ? "hidden" : "visible";
  $("progress").style.visibility = bw.isWimHof ? "hidden" : "visible";
  S.tick = setInterval(sessionTick, 250);
  wakeLock();
  frame();
}
function layoutSession() {
  const { W, H } = stageSize(), loc = S.loc;
  $("session-bg").style.backgroundImage = `url(${BACKGROUNDS[loc.id]})`;
  const m = $("session-monk");
  m.src = MONK;
  placeMonk(m, loc, W, H);
  const monkH = W * loc.monkScale;
  S.diameter = monkH * 0.55;
  const chest = loc.breathCenterY != null ? H * loc.breathCenterY : H * loc.monkAnchorY + monkH * 0.35;
  const PAD = 100, size = S.diameter + PAD * 2;
  const c = $("breath-canvas"), dpr = window.devicePixelRatio || 1;
  c.width = size * dpr; c.height = size * dpr;
  c.style.width = c.style.height = size + "px";
  c.style.left = (W - size) / 2 + "px";
  c.style.top = H - chest - size / 2 + "px";
  S.ctx = c.getContext("2d");
  S.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S.canvasSize = size;
}
function stopSession() {
  if (!S) return;
  cancelAnimationFrame(S.raf);
  clearInterval(S.tick);
  S.done = true;
  releaseWake();
}
const elapsedSec = () => Math.floor((performance.now() - S.start) / 1000);

function sessionTick() {
  if (!S || S.done) return;
  const now = performance.now();
  if (S.wimStage === "breathing") {
    for (;;) {
      const ph = S.bw.phases[S.phaseIdx];
      if (now - S.phaseStart < ph.seconds * 1000) break;
      S.phaseStart += ph.seconds * 1000;
      if (S.bw.isWimHof && ph.label === "Exhale" && ++S.wimBreaths >= S.wimTarget) {
        S.wimStage = "retention"; S.stageStart = S.phaseStart;
        break;
      }
      S.phaseIdx = (S.phaseIdx + 1) % S.bw.phases.length;
    }
  } else if (S.wimStage === "recovery" && now - S.stageStart >= WIM_RECOVERY * 1000) {
    S.wimStage = "done";
    return completeSession(elapsedSec());
  }
  if (!S.bw.isWimHof) {
    const el = Math.min(elapsedSec(), S.total);
    $("timer").textContent = fmt(S.total - el);
    $("progress").firstElementChild.style.width = (el / S.total) * 100 + "%";
    if (el >= S.total) return completeSession(S.total);
  }
}
function wimAdvance() {
  if (!S || S.wimStage !== "retention") return;
  S.wimStage = "recovery";
  S.stageStart = performance.now();
}
$("session").addEventListener("pointerdown", (e) => { if (!e.target.closest("button")) wimAdvance(); });
document.addEventListener("keydown", (e) => {
  if (current !== "session") return;
  if (e.key === "Escape") return $("end-btn").click();
  wimAdvance();
});
$("end-btn").onclick = () => { stopSession(); show("setup"); };
$("done-btn").onclick = () => show("setup");

function frame() {
  if (!S || S.done) return;
  sessionTick();
  if (S.done) return;
  const now = performance.now(), bw = S.bw;
  let breathT, color, label, center, sub = "", pulse = 0, rippleT;
  const ph = bw.phases[S.phaseIdx];
  if (S.wimStage === "breathing") {
    const t = Math.min(1, (now - S.phaseStart) / (ph.seconds * 1000));
    color = phaseColor(bw, S.phaseIdx);
    if (ph.isHold) { breathT = holdValue(bw, S.phaseIdx); pulse = 1; }
    else breathT = ph.label === "Inhale" ? easeOut(t) : 1 - easeOut(t);
    label = ph.label.toUpperCase();
    center = String(Math.max(1, Math.ceil(ph.seconds * (1 - t))));
    rippleT = (now - S.phaseStart) / 1100;
    if (bw.isWimHof) sub = `Breath ${Math.min(S.wimBreaths + 1, S.wimTarget)} / ${S.wimTarget}`;
  } else if (S.wimStage === "retention") {
    breathT = 0; color = HOLD_EMPTY; pulse = 1; label = "RETENTION";
    center = fmt(Math.floor((now - S.stageStart) / 1000));
    sub = "Tap when ready to inhale";
    rippleT = (now - S.stageStart) / 1100;
  } else {
    breathT = 1; color = HOLD_FULL; pulse = 1; label = "INHALE & HOLD";
    center = String(Math.max(1, Math.ceil(WIM_RECOVERY - (now - S.stageStart) / 1000)));
    sub = "Hold the breath in";
    rippleT = (now - S.stageStart) / 1100;
  }
  const pulseT = pulse ? (1 - Math.cos((now / 2800) * Math.PI)) / 2 : 0;
  $("session-monk").style.transform = `scale(${1 + breathT * 0.0125})`;
  drawBreath(S.ctx, S.canvasSize, S.diameter, breathT, rippleT, pulseT, color, label, center, sub);
  S.raf = requestAnimationFrame(frame);
}

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${Math.max(0, Math.min(1, a))})`;
}
// Port of _BreathCirclePainter
function drawBreath(ctx, size, diameter, breathT, rippleT, pulseT, color, label, center, sub) {
  ctx.clearRect(0, 0, size, size);
  const cx = size / 2, cy = size / 2;
  const maxR = (diameter / 2) * 0.82, minR = maxR * 0.42;
  const baseR = minR + (maxR - minR) * breathT;
  const r = baseR + pulseT * 5;
  const ring = (rad, a, w) => { ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.strokeStyle = rgba(color, a); ctx.lineWidth = w; ctx.stroke(); };
  if (rippleT < 1) ring(baseR + rippleT * 70, (1 - rippleT) * 0.55, 2);
  if (rippleT > 0.18 && rippleT < 1) { const t2 = (rippleT - 0.18) / 0.82; ring(baseR + t2 * 48, (1 - t2) * 0.35, 1.5); }
  const glow = (rad, blur, a) => {
    const g = ctx.createRadialGradient(cx, cy, Math.max(0, rad - blur), cx, cy, rad + blur);
    g.addColorStop(0, rgba(color, a)); g.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, rad + blur, 0, Math.PI * 2); ctx.fill();
  };
  glow(r + 28, 36, 0.07);
  glow(r + 8, 16, 0.2);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r - 1.5, 0, Math.PI * 2); ctx.clip();
  const fillTop = cy + r - r * 2 * breathT;
  ctx.fillStyle = rgba(color, 0.28);
  ctx.fillRect(cx - r, fillTop, r * 2, cy + r - fillTop);
  if (breathT > 0.01 && breathT < 0.99) { ctx.fillStyle = rgba(color, 0.45); ctx.fillRect(cx - r, fillTop, r * 2, 3); }
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2); ctx.fillStyle = rgba(color, 0.06); ctx.fill();
  ring(r, 0.65, 1.5);
  if (breathT > 0.001) {
    ctx.beginPath(); ctx.arc(cx, cy, r + 11, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * breathT);
    ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.stroke();
  }
  const fs = diameter / 280, font = getComputedStyle(document.body).fontFamily;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,0.75)"; ctx.shadowBlur = 8;
  ctx.fillStyle = color;
  ctx.font = `400 ${12 * fs}px ${font}`;
  if ("letterSpacing" in ctx) ctx.letterSpacing = `${4.5 * fs}px`;
  ctx.fillText(label, cx + 2.25 * fs, cy - 26 * fs);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  ctx.fillStyle = "#F0EBE3";
  ctx.font = `300 ${48 * fs}px ${font}`;
  ctx.fillText(center, cx, cy + 10 * fs);
  if (sub) {
    ctx.fillStyle = rgba("#F0EBE3", 0.92);
    ctx.font = `600 ${Math.max(10, 11 * fs)}px ${font}`;
    ctx.fillText(sub, cx, cy + r + 34);
  }
  ctx.shadowBlur = 0;
}

// ── Completion: light gathers into the monk ────────────────────────────
function completeSession(durationSec) {
  const { loc, bw } = S;
  stopSession();
  $("breath-canvas").style.display = "none";
  $("session-monk").style.transform = "none";
  $("end-btn").style.visibility = "hidden";
  const mins = Math.max(1, Math.round(durationSec / 60));
  $("done-text").textContent = bw.isWimHof
    ? `${S.wimTarget} breaths at ${loc.name.replace(/^The /, "the ")}.`
    : `${mins} minute${mins === 1 ? "" : "s"} of ${bw.name} at ${loc.name.replace(/^The /, "the ")}.`;
  const { W, H } = stageSize();
  const monkW = W * loc.monkScale, monkH = monkW * MONK_ASPECT;
  const target = { x: W / 2, y: H - H * loc.monkAnchorY - monkH * loc.targetRatio };
  $("stars").style.display = "";
  starShower($("stars"), W, H, target, loc.starColor, () => $("done-card").classList.add("show"));
}
function starShower(canvas, W, H, target, color, onDone) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  canvas.style.left = canvas.style.top = "0";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const stars = Array.from({ length: 140 }, () => ({
    x: Math.random() * W, y: -Math.random() * H * 0.6 - 10,
    delay: Math.random() * 1400, dur: 1800 + Math.random() * 1400,
    size: 0.8 + Math.random() * 2.2, wob: (Math.random() - 0.5) * 80,
  }));
  const t0 = performance.now();
  let called = false;
  (function draw() {
    const t = performance.now() - t0;
    ctx.clearRect(0, 0, W, H);
    let landed = 0;
    for (const s of stars) {
      const p = Math.min(1, Math.max(0, (t - s.delay) / s.dur));
      if (p <= 0) continue;
      if (p >= 1) { landed++; continue; }
      const e = p * p * (3 - 2 * p);
      const x = s.x + (target.x - s.x) * e + Math.sin(p * Math.PI) * s.wob;
      const y = s.y + (target.y - s.y) * e;
      ctx.fillStyle = rgba(color, 0.35 + 0.65 * Math.sin(p * Math.PI));
      ctx.beginPath(); ctx.arc(x, y, s.size * (1 - p * 0.5), 0, Math.PI * 2); ctx.fill();
    }
    const glowA = Math.min(1, landed / stars.length) * (t < 4200 ? 1 : Math.max(0.35, 1 - (t - 4200) / 2000));
    if (glowA > 0) {
      const g = ctx.createRadialGradient(target.x, target.y, 0, target.x, target.y, W * 0.35);
      g.addColorStop(0, rgba(color, 0.55 * glowA)); g.addColorStop(0.3, rgba(color, 0.18 * glowA)); g.addColorStop(1, rgba(color, 0));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (!called && t > 3600) { called = true; onDone(); }
    if (t < 7000 && current === "session") requestAnimationFrame(draw);
  })();
}

// Keep the phone screen awake during a session where supported
let wake = null;
async function wakeLock() { try { wake = await navigator.wakeLock?.request("screen"); } catch (e) { wake = null; } }
function releaseWake() { try { wake?.release(); } catch (e) {} wake = null; }
document.addEventListener("visibilitychange", () => { if (!document.hidden && S && !S.done) wakeLock(); });

window.addEventListener("resize", () => { if (current === "session" && S && !S.done) layoutSession(); });

renderSetup();
show("setup");
</script>
</body>
